<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하나예린이의 역사 공부앱 v2</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #15803d;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #b91c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        
        .app-container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; min-height: 640px; position: relative; }
        
        header { background: linear-gradient(135deg, #6366f1, #3730a3); color: white; padding: 22px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        header h1 { font-size: 1.4rem; margin-bottom: 6px; font-weight: 800; letter-spacing: -0.5px; }
        header p { font-size: 0.85rem; opacity: 0.9; }

        .content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .screen { display: none; flex-direction: column; height: 100%; justify-content: space-between; }
        .screen.active { display: flex; }

        .menu-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .menu-btn { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 18px; padding: 14px 18px; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .menu-btn:active { transform: scale(0.98); background: #e0e7ff; }
        .menu-btn h3 { font-size: 0.95rem; color: var(--primary); margin-bottom: 3px; font-weight: 700; }
        .menu-btn span.sub { font-size: 0.78rem; color: var(--text-sub); }
        .badge { background: #e0e7ff; color: var(--primary); font-size: 0.72rem; padding: 4px 8px; border-radius: 10px; font-weight: bold; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #4f46e5); width: 0%; transition: width 0.3s ease; }

        .question-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 18px; margin-bottom: 16px; font-size: 1.02rem; font-weight: 700; line-height: 1.5; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-main); word-break: keep-all; }

        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .option-btn { background: white; border: 2px solid #cbd5e1; border-radius: 14px; padding: 14px 16px; text-align: left; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; font-weight: 600; color: #334155; word-break: keep-all; }
        .option-btn:active:not(:disabled) { background: #f1f5f9; }
        .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: bold; }
        .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: var(--wrong-text) !important; }

        .explanation-box { background: #eff6ff; border: 1.5px solid #bfdbfe; padding: 14px; border-radius: 14px; font-size: 0.85rem; color: #1e40af; margin-bottom: 15px; display: none; line-height: 1.5; word-break: keep-all; }

        .action-btn { background: var(--primary); color: white; border: none; border-radius: 16px; padding: 16px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: all 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .action-btn:active { transform: scale(0.98); background: var(--primary-hover); }

        .result-card { text-align: center; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; }
        .result-score { font-size: 3rem; font-weight: 900; color: var(--primary); margin: 12px 0; }
        .score-info { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <h1>🏛️ 하나예린이의 역사앱</h1>
        <p>초등 5학년 사회(역사) 100문항 총정리</p>
    </header>

    <div class="content">
        <!-- 홈 화면 -->
        <div id="home-screen" class="screen active">
            <div>
                <p style="margin-bottom: 12px; font-weight: 700; font-size: 0.9rem; color: var(--text-sub);">학습할 역사 단원을 선택해 주세요!</p>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="startQuiz('early')">
                        <div><h3>1. 선사 시대 ~ 고조선</h3><span class="sub">구석기부터 고조선까지</span></div>
                        <span class="badge" id="best-early">20문제</span>
                    </button>
                    <button class="menu-btn" onclick="startQuiz('three')">
                        <div><h3>2. 삼국 시대와 남북국</h3><span class="sub">고구려, 백제, 신라, 발해</span></div>
                        <span class="badge" id="best-three">20문제</span>
                    </button>
                    <button class="menu-btn" onclick="startQuiz('goryeo')">
                        <div><h3>3. 고려 시대</h3><span class="sub">외세 침입 극복과 고려 문화</span></div>
                        <span class="badge" id="best-goryeo">20문제</span>
                    </button>
                    <button class="menu-btn" onclick="startQuiz('joseon')">
                        <div><h3>4. 조선 시대</h3><span class="sub">세종대왕, 임진왜란, 실학</span></div>
                        <span class="badge" id="best-joseon">20문제</span>
                    </button>
                    <button class="menu-btn" onclick="startQuiz('modern')">
                        <div><h3>5. 개항기 ~ 근현대사</h3><span class="sub">독립운동과 대한민국</span></div>
                        <span class="badge" id="best-modern">20문제</span>
                    </button>
                    <button class="menu-btn" onclick="startQuiz('all')" style="border-color: #a5b4fc; background: #f5f3ff;">
                        <div><h3 style="color: #6366f1;">⭐ 100문항 전체 모의고사</h3><span class="sub">전 범위 랜덤 실력 테스트</span></div>
                        <span class="badge" style="background: #6366f1; color: white;">🔥 ALL</span>
                    </button>
                </div>
            </div>
            <div style="text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 15px;">Made for Hanyerin ❤️</div>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="screen">
            <div>
                <div class="quiz-header">
                    <span id="quiz-category-title">선사 시대</span>
                    <span id="quiz-progress-text">1 / 20</span>
                </div>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <div id="question-box" class="question-box">문제가 들어갑니다.</div>
                <div id="options-list" class="options-list"></div>
                <div id="explanation-box" class="explanation-box"></div>
            </div>
            <button id="next-btn" class="action-btn" onclick="nextQuestion()" style="display: none;">다음 문제로</button>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="screen" style="justify-content: center;">
            <div class="result-card">
                <h2 id="result-title">🎉 퀴즈 완료!</h2>
                <div id="result-score" class="result-score">100점</div>
                <div id="result-info" class="score-info">정답: 20개 / 오답: 0개</div>
                <button class="action-btn" onclick="goHome()">메뉴로 돌아가기</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 오디오 생성 함수 (웹 오디오 API 사용)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
            osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.15); // F3
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // 100문항 고품질 데이터베이스
    const quizData = {
        early: [
            { q: "1. 신석기 시대 사람들이 돌을 갈아서 만든 도구의 이름은 무엇일까요?", options: ["뗀석기", "간석기", "철제검", "청동거울"], answer: 1, explanation: "신석기 시대에는 돌을 떼어내는 것에서 발전해 정교하게 갈아 만든 '간석기'를 사용했습니다." },
            { q: "2. 신석기 시대 사람들이 곡식을 저장하거나 음식을 조리하기 위해 만든 토기는?", options: ["비파형 토기", "분청사기", "빗살무늬 토기", "백자"], answer: 2, explanation: "신석기 시대의 대표적인 유물은 '빗살무늬 토기'입니다." },
            { q: "3. 우리 민족 최초의 국가로, 청동기 문화를 바탕으로 세워진 나라는?", options: ["고조선", "부여", "고구려", "신라"], answer: 0, explanation: "단군왕검이 세운 우리 민족 최초의 국가는 고조선입니다." },
            { q: "4. 고조선의 사회 규칙으로, 생명과 재산을 보호하기 위해 만들어진 법은?", options: ["율타법", "8조법", "경국대전", "대한전법"], answer: 1, explanation: "고조선에는 사람의 생명과 재산을 중요하게 여긴 '8조법'이 있었습니다." },
            { q: "5. 신석기 시대 사람들이 바닥을 파고 살았던 집의 이름은?", options: ["초가집", "기와집", "움집", "막집"], answer: 2, explanation: "신석기 시대 사람들은 동그랗게 바닥을 파고 만든 '움집'에서 정착 생활을 했습니다." },
            { q: "6. 청동기 시대 지배자의 무덤으로, 커다란 돌을 괴어 만든 무덤은?", options: ["고인돌", "적석총", "돌무지덧널무덤", "왕릉"], answer: 0, explanation: "청동기 시대 계급이 발생하면서 강력한 군장의 무덤으로 '고인돌'을 쌓았습니다." },
            { q: "7. 단군신화에서 쑥과 마늘을 먹고 사람이 된 동물은 무엇일까요?", options: ["사자", "호랑이", "곰", "여우"], answer: 2, explanation: "곰이 100일 동안 쑥과 마늘을 먹고 인내하여 인간 '웅녀'가 되었습니다." },
            { q: "8. 고조선이 세워진 날을 기념하여 만든 우리나라의 국경일은?", options: ["개천절", "제헌절", "광복절", "삼일절"], answer: 0, explanation: "하늘이 열린 날을 기념하는 10월 3일 '개천절'입니다." },
            { q: "9. 청동기 시대에 농사를 지을 때 곡식의 이삭을 잘라내던 돌 도구는?", options: ["반달 돌칼", "돌도끼", "주먹도끼", "살촉"], answer: 0, explanation: "곡식 수확에 사용하던 청동기 시대 대표 돌 도구는 '반달 돌칼'입니다." },
            { q: "10. 농경과 정착 생활이 본격적으로 시작된 시대는 언제일까요?", options: ["구석기 시대", "신석기 시대", "철기 시대", "현대"], answer: 1, explanation: "신석기 시대부터 농사를 짓기 시작하며 '신석기 혁명'이 시작되었습니다." },
            { q: "11. 구석기 시대 사람들이 주로 도구를 만들어 쓴 방법은?", options: ["돌을 깨뜨려 만든 뗀석기", "돌을 맷돌로 판 간석기", "쇠를 녹여 만든 철기", "흙을 구운 토기"], answer: 0, explanation: "구석기 시대에는 돌을 깨트려 만든 '뗀석기'를 사용했습니다." },
            { q: "12. 단군왕검에서 '단군'과 '왕검'의 뜻으로 올바른 설명은?", options: ["제사장과 정치적 지배자", "장군과 국왕", "학자와 농부", "왕과 왕비"], answer: 0, explanation: "단군은 종교적 제사장, 왕검은 정치적 지배자를 뜻하여 제정일치 사회였음을 보여줍니다." },
            { q: "13. 청동기 시대에 처음 등장한 무기로, 비파라는 악기 모양을 닮은 검은?", options: ["비파형 동검", "세형 동검", "사인검", "환두대도"], answer: 0, explanation: "청동기 시대를 대표하는 만주와 한반도 고유의 무기는 '비파형 동검'입니다." },
            { q: "14. 구석기 시대 사람들이 추위나 짐승을 피해 살았던 거처가 아닌 것은?", options: ["동굴", "바위 그늘", "막집", "아파트"], answer: 3, explanation: "구석기인들은 이동 생활을 하며 동굴, 바위그늘, 막집에서 살았습니다." },
            { q: "15. 신석기 시대에 실을 뽑아 옷이나 그물을 만들 때 쓰던 도구는?", options: ["가락바퀴", "빗살무늬토기", "반달돌칼", "거푸집"], answer: 0, explanation: "가락바퀴와 뼈바늘을 사용하여 옷이나 그물을 제작했습니다." },
            { q: "16. 철기 시대에 농기구로 철을 사용하면서 나타난 변화는?", options: ["농업 생산량이 늘었다", "농사를 그만두었다", "돌 도구만 썼다", "움집이 사라졌다"], answer: 0, explanation: "단단한 철제 농기구 사용으로 땅을 깊이 갈 수 있어 농업 생산량이 크게 크게 증가했습니다." },
            { q: "17. 고조선 시대의 범금 8조 중 남아있는 3가지 조항으로 알 수 없는 것은?", options: ["인명 존중", "사유 재산 인정", "노비 제도 존재", "무료 병원 설립"], answer: 3, explanation: "8조법에는 생명, 재산, 계급(노비)에 대한 법률이 포함되어 있었습니다." },
            { q: "18. 단군신화에 나오는 환웅이 거느리고 내려온 세 신(풍백, 우사, 운사)이 상징하는 것은?", options: ["농경 사회의 중요성", "상업의 중요성", "어업의 중요성", "공업의 중요성"], answer: 0, explanation: "바람, 비, 구름을 관장하는 신은 농사에 날씨가 매우 중요했음을 보여줍니다." },
            { q: "19. 구석기 시대 사람들이 음식을 얻었던 대표적인 방법은?", options: ["채집과 사냥", "벼농사", "공장 생산", "해외 무역"], answer: 0, explanation: "구석기 시대에는 자연에서 얻는 열매 채집과 짐승 사냥을 통해 음식을 얻었습니다." },
            { q: "20. 청동기 시대에 계급이 생겨났음을 잘 보여주는 유적·유물은?", options: ["고인돌", "움집터", "뗀석기", "조개껍데기 가면"], answer: 0, explanation: "거대한 고인돌을 짓기 위해 수많은 인력을 동원할 수 있는 권력자가 생겼음을 알 수 있습니다." }
        ],
        three: [
            { q: "21. 만주 벌판까지 영토를 넓히고 광개토대왕능비를 남긴 고구려의 왕은?", options: ["장수왕", "동명성왕", "광개토대왕", "주몽"], answer: 2, explanation: "광개토대왕은 영토를 대대적으로 넓힌 정복 군주입니다." },
            { q: "22. 살수에서 수나라 대군을 물리친 고구려의 장군은?", options: ["을지문덕", "연개소문", "강감찬", "김유신"], answer: 0, explanation: "을지문덕 장군이 살수에서 수나라 30만 대군을 물리쳤습니다." },

            { q: "100. 1948년 7월 17일 대한민국 최초의 헌법이 제정된 것을 기념하는 국경일은?", options: ["제헌절", "개천절", "광복절", "삼일절"], answer: 0, explanation: "대한민국 헌법 제정을 기념하는 7월 17일 '제헌절'입니다." }

    let currentCategory = [];
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let selectedAnswer = null;
    let currentCategoryKey = '';

    function startQuiz(type) {
        currentCategoryKey = type;
        if (type === 'all') {
            // 전 범위를 섞어서 100문제 모의고사 진행
            currentCategory = [...quizData.early, ...quizData.three, ...quizData.goryeo, ...quizData.joseon, ...quizData.modern];
            currentCategory.sort(() => Math.random() - 0.5);
            document.getElementById('quiz-category-title').innerText = "⭐ 100문항 모의고사";
        } else {
            currentCategory = [...quizData[type]];
            const titles = {
                early: "1. 선사 시대 ~ 고조선",
                three: "2. 삼국 시대와 남북국",
                goryeo: "3. 고려 시대",
                joseon: "4. 조선 시대",
                modern: "5. 개항기 ~ 근현대사"
            };
            document.getElementById('quiz-category-title').innerText = titles[type];
        }

        currentIndex = 0;
        score = 0;
        correctCount = 0;
        wrongCount = 0;

        document.getElementById('home-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        selectedAnswer = null;
        const qData = currentCategory[currentIndex];
        
        document.getElementById('quiz-progress-text').innerText = `${currentIndex + 1} / ${currentCategory.length}`;
        document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / currentCategory.length) * 100}%`;
        document.getElementById('question-box').innerText = qData.q;

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        
        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsList.appendChild(btn);
        });

        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(idx) {
        if (selectedAnswer !== null) return;
        selectedAnswer = idx;
        const qData = currentCategory[currentIndex];
        const buttons = document.querySelectorAll('.option-btn');

        if (idx === qData.answer) {
            playSound('correct');
            correctCount++;
            buttons[idx].classList.add('correct');
        } else {
            playSound('wrong');
            wrongCount++;
            buttons[idx].classList.add('wrong');
            buttons[qData.answer].classList.add('correct');
        }

        buttons.forEach(btn => btn.disabled = true);

        const expBox = document.getElementById('explanation-box');
        expBox.innerHTML = `💡 <b>해설:</b> ${qData.explanation}`;
        expBox.style.display = 'block';

        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
        nextBtn.innerText = (currentIndex === currentCategory.length - 1) ? "결과 보기" : "다음 문제로";
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentCategory.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        const finalScore = Math.round((correctCount / currentCategory.length) * 100);
        document.getElementById('result-score').innerText = `${finalScore}점`;
        document.getElementById('result-info').innerText = `정답: ${correctCount}개 / 오답: ${wrongCount}개 (총 ${currentCategory.length}문항)`;

        if (finalScore === 100) {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            document.getElementById('result-title').innerText = "🏆 완벽해요! 만점 달성!";
        } else if (finalScore >= 80) {
            document.getElementById('result-title').innerText = "🎉 대단해요! 역사 박사님!";
        } else {
            document.getElementById('result-title').innerText = "💪 더 연습해서 만점에 도전해요!";
        }
    }

    function goHome() {
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('home-screen').classList.add('active');
    }
</script>
